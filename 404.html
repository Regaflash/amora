<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>הדף לא נמצא | Amora Studio</title>
<!-- noindex, follow: a 404 must never enter the index, but the links out of it
     should still pass. Vercel serves this file for any unmatched path in a
     static deployment and returns a real 404 status with it, so this is not a
     soft 404. Without the file, Vercel's own generic error page is what a
     visitor lands on after a stale WhatsApp share or a mistyped URL. -->
<meta name="robots" content="noindex, follow" />
<meta name="theme-color" content="#F7F2EA" />
<!-- Every asset below is referenced ROOT-ABSOLUTE (/assets/...), not relative.
     Vercel serves this file's bytes AT the URL that was not found - the address
     bar still says /old/link/that/died - so a relative "assets/css/..." would
     resolve to /old/link/that/assets/css/... and the page would arrive
     unstyled, unfonted and without the accessibility widget. Only a top-level
     typo would have worked. Do not make these relative again. -->
<link rel="manifest" href="/site.webmanifest" />
<link rel="icon" href="/favicon.ico" sizes="48x48" />
<link rel="icon" href="/assets/img/icon-96.png" type="image/png" sizes="96x96" />
<link rel="icon" href="/assets/img/icon-192.png" type="image/png" sizes="192x192" />
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png" />
<link rel="preload" href="/assets/fonts/frank-ruhl-libre-hebrew-600-normal.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="/assets/css/fonts.css" />
<style>
  * { box-sizing: border-box; }
  /* styles.css is deliberately not loaded here (see .nf__btn below), so the
     skip link it styles site-wide arrived naked: measured static, visible,
     71x24px above the logo on every 404 — and body's place-items grid made
     it a full row that pushed the card down. Restated in literals, same rule
     as the pill radius. inset-inline-start, not left: RTL. */
  .skip-link {
    position: absolute;
    top: -100px;
    inset-inline-start: 18px;
    z-index: 100;
    padding: 14px 22px;
    background: #C9AE8C;
    color: #1C1A18;
    font-size: 14px;
    letter-spacing: .08em;
    border-radius: 999px;
    text-decoration: none;
    transition: top 200ms cubic-bezier(0.4, 0, 0.2, 1);
  }
  .skip-link:focus { top: 0; }
  body {
    margin: 0;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 40px clamp(18px, 5vw, 56px);
    background: #F7F2EA;
    color: #1C1A18;
    font-family: Heebo, system-ui, sans-serif;
    font-weight: 300;
    text-align: center;
  }
  .nf { max-width: 46ch; position: relative; }
  .nf__mark { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; }
  /* The chapter signature the whole site opens sections with — hairline rule,
     72px champagne segment at the reading-start — in literals, on the one
     card this page has. background-color, never a gradient: a11y-contrast
     blanks background-images and this decoration must survive it. */
  .nf__kicker {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 15px;
    letter-spacing: .2em;
    color: #C9AE8C;
    position: relative;
    border-top: 1px solid rgba(107, 91, 75, 0.24);
    padding-top: 24px;
    margin: 26px 0 10px;
  }
  .nf__kicker::before {
    content: "";
    position: absolute;
    top: -1px;
    inset-inline-start: 0;
    width: 72px;
    height: 1px;
    background-color: #C9AE8C;
  }
  .nf__title {
    font-family: 'Frank Ruhl Libre', serif;
    font-weight: 600;
    font-size: clamp(1.6rem, 5vw, 2.4rem);
    line-height: 1.25;
    margin: 0 0 14px;
  }
  .nf__text { font-size: 16px; line-height: 1.75; color: #4A3F35; margin: 0 0 30px; }
  .nf__actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .nf__btn {
    font-size: 12px;
    letter-spacing: .16em;
    padding: 15px 28px;
    text-decoration: none;
    border: 1px solid #C9AE8C;
    /* Literal, not var(--r-pill): this page is self-contained and never loads
       styles.css — served AT the address that was not found, it keeps zero
       dependencies. Same pill/press language as the site, restated. */
    border-radius: 999px;
    color: #1C1A18;
    transition: background 220ms cubic-bezier(0.4, 0, 0.2, 1),
                color 220ms cubic-bezier(0.4, 0, 0.2, 1),
                transform 220ms cubic-bezier(0.4, 0, 0.2, 1);
  }
  .nf__btn--solid { background: #1C1A18; border-color: #1C1A18; color: #FFFDF9; }
  .nf__btn:hover { background: #C9AE8C; border-color: #C9AE8C; color: #FFFDF9; transform: translateY(-2px); }
  .nf__btn:active { transform: translateY(1px); }
  .nf__btn:focus-visible { outline: 3px solid #1C1A18; outline-offset: 3px; }
  .nf__links { margin: 26px 0 0; font-size: 14px; }
  .nf__links a { color: #4A3F35; margin: 0 8px; }
  /* The OS motion preference, answered in CSS: the site-wide copy of this
     block lives in styles.css, which this page never loads — so until now
     the .nf__btn transitions obeyed only the JS-driven a11y-no-motion class,
     and with JS off the preference was ignored on this page alone. */
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
<link rel="stylesheet" href="/assets/css/a11y-widget.css" />
<script src="/assets/js/a11y-widget.js"></script>
<!-- Vercel Analytics, added 2026-08-13. Same-origin on purpose: the script and
     its beacon are served from /_vercel/* by the host, so the enforcing CSP
     needs no new source -- script-src 'self' and connect-src 'self' already
     cover both, and check.sh's external-dependency guard stays honest because
     nothing third-party is fetched at runtime.
     It only exists once Analytics is enabled in the Vercel dashboard; until
     then the path 404s and the tag does nothing. privacy.html is written to
     match what this collects -- if this tag goes, that section goes with it. -->
<script src="/_vercel/insights/script.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">דילוג לתוכן</a>
<main id="main" class="nf">
    <img class="nf__mark" src="/assets/img/logo.jpg" alt="Amora Studio" width="72" height="72" />
    <p class="nf__kicker">404</p>
    <h1 class="nf__title">הדף הזה כבר לא כאן</h1>
    <p class="nf__text">
      יכול להיות שהקישור ישן, או שנפלה טעות בכתובת.
      אפשר לחזור לעמוד הבית, לעבור ישר לגלריה, או פשוט לכתוב לנו.
    </p>
    <div class="nf__actions">
      <a class="nf__btn nf__btn--solid" href="/">לעמוד הבית</a>
      <a class="nf__btn" href="/#gallery">לגלריה</a>
      <a class="nf__btn" href="/#contact">לבדיקת זמינות</a>
    </div>
    <p class="nf__links">
      <a href="tel:+972503662699">050-3662699</a>
      <a href="/#faq">שאלות נפוצות</a>
    </p>
  </main>
</body>
</html>
